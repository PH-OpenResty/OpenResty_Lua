name: Native Sync master and node

on:
  push:
    paths: ['native-sync/**', '.github/workflows/native-sync.yml']
  pull_request:
    paths: ['native-sync/**', '.github/workflows/native-sync.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [nginx, openresty]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl libpcre2-dev libssl-dev zlib1g-dev curl
          python -m pip install -r scdn-sync/tests/requirements.txt
      - name: Native core with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          SCDN_NATIVE_SANITIZERS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: sh native-sync/tests/check-core.sh
      - name: Build runtime and dynamic module
        env:
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: sh native-sync/tests/build-runtime.sh "$RUNNER_TEMP/native-sync" "$NATIVE_RUNTIME"
      - name: Master and node roles, authentication and configuration boundaries
        run: python native-sync/tests/integration.py --prefix "$RUNNER_TEMP/native-sync" --report "$RUNNER_TEMP/native-sync-results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-sync-${{ matrix.runtime }}-results
          path: ${{ runner.temp }}/native-sync-results.json
