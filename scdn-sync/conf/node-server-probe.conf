# Include inside every managed HTTP and HTTPS server used by the agent's probe ports.
location = /__scdn_sync_probe {
    satisfy all;
    auth_basic off;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    rewrite_by_lua_block { }
    access_by_lua_block { }
    content_by_lua_block { require('scdn_sync.runtime.registry').probe() }
}
