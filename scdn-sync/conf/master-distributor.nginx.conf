# Independent instance: adding a server to the business instance does not isolate workers.
worker_processes 2;
pid /run/scdn-sync-master-distributor/distributor.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
    access_log off;
    server_tokens off;
    lua_need_request_body off;
    client_header_timeout 5s;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 15s;
    lua_package_path "/opt/scdn-sync/lib/?.lua;/opt/scdn-sync/vendor/lua-resty-http/lib/?.lua;;";
    limit_req_zone $ssl_client_fingerprint zone=scdn_sync_rate:4m rate=20r/s;
    limit_conn_zone $ssl_client_fingerprint zone=scdn_sync_per_node:4m;
    limit_conn_zone $server_name zone=scdn_sync_global:128k;
    init_by_lua_block {
        local settings = require('scdn_sync.config').load('/etc/scdn-sync/master-distributor.lua')
        require('scdn_sync.master.distributor').configure(settings)
    }
    init_worker_by_lua_block { require('scdn_sync.master.distributor').init_worker() }
    server {
        listen 8443 ssl;
        server_name sync.example.com;
        ssl_certificate /etc/scdn-sync/pki/master.crt;
        ssl_certificate_key /etc/scdn-sync/pki/master.key;
        ssl_client_certificate /etc/scdn-sync/pki/node-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 3;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        limit_req zone=scdn_sync_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn scdn_sync_per_node 8;
        limit_conn scdn_sync_global 1024;
        limit_conn_status 503;
        set $scdn_sync_etag "";
        location /_scdn_sync/v1/ {
            content_by_lua_block { require('scdn_sync.master.distributor').handle() }
        }
        location /_scdn_sync_files/ {
            internal;
            alias /var/lib/scdn-sync-master/nodes/;
            default_type application/jose;
            etag off;
            add_header ETag $scdn_sync_etag always;
            add_header Cache-Control no-store always;
            limit_rate 4m;
        }
        location / { return 404; }
    }
}
