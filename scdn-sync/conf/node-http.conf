# Merge these http-level directives into the existing configuration once.
# Install the compatibility path only after importing the complete managed site set.
lua_package_path "/opt/scdn-sync/compat/?.lua;/opt/scdn-sync/lib/?.lua;/opt/scdn-sync/vendor/lua-resty-http/lib/?.lua;/usr/local/openresty/lua_files/?.ljbc;/usr/local/openresty/lua_files/?.lua;;";
lua_shared_dict scdn_sync_data 16m;
lua_shared_dict scdn_sync_state 2m;
lua_shared_dict scdn_sync_locks 128k;
init_by_lua_block {
    local config = require 'scdn_sync.config'
    local settings = config.load('/etc/scdn-sync/runtime.lua')
    local store = require('scdn_sync.fs').open(settings.data_dir)
    require('scdn_sync.runtime.registry').configure(settings, config.bootstrap(settings, store))
}
init_worker_by_lua_block { require('scdn_sync.runtime.registry').init_worker() }
server {
    listen unix:/run/scdn-sync-node/control.sock;
    server_name localhost;
    access_log off;
    lua_need_request_body off;
    satisfy all;
    auth_basic off;
    allow unix:;
    deny all;
    rewrite_by_lua_block { }
    access_by_lua_block { }
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    client_body_timeout 5s;
    location / { content_by_lua_block { require('scdn_sync.runtime.registry').handle() } }
}
