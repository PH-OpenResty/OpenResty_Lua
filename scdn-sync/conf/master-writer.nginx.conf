# Run as a dedicated service, using the same private data UID as the publisher.
worker_processes 1;
pid /run/scdn-sync-master-writer/writer.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    lua_need_request_body off;
    client_header_timeout 5s;
    client_max_body_size 128k;
    client_body_buffer_size 128k;
    client_body_timeout 5s;
    lua_package_path "/opt/scdn-sync/lib/?.lua;/opt/scdn-sync/vendor/lua-resty-http/lib/?.lua;;";
    init_by_lua_block {
        local config = require 'scdn_sync.config'
        local settings = config.load('/etc/scdn-sync/master-writer.lua')
        require('scdn_sync.master.service').configure(settings, require('scdn_sync.fs').open(settings.data_dir))
    }
    server {
        listen unix:/run/scdn-sync-master-writer/writer.sock;
        server_name localhost;
        location / { content_by_lua_block { require('scdn_sync.master.service').handle() } }
    }
}
