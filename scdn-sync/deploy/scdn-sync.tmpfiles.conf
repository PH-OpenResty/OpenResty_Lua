# Create service accounts before applying this file. Business Nginx owns no lifecycle
# of the agent service, so its control directory is kept outside RuntimeDirectory.
d /var/lib/scdn-sync-master 0700 scdn-sync-master scdn-sync-master -
d /var/lib/scdn-sync-node 0700 scdn-sync-node scdn-sync-node -
d /run/scdn-sync-node 0700 scdn-sync-node scdn-sync-node -
